version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: tries-suggest-mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: search_db
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-change-me}
    volumes:
      - mongo_data:/data/db
    networks:
      - tries-network

  redis:
    image: redis:7.2-alpine
    container_name: tries-suggest-redis
    ports:
      - "6379:6379"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-change-me}
    command: ["sh", "-c", "redis-server --appendonly yes --requirepass \"$REDIS_PASSWORD\""]
    volumes:
      - redis_data:/data
    networks:
      - tries-network

volumes:
  mongo_data:
  redis_data:

networks:
  tries-network:
    driver: bridge
