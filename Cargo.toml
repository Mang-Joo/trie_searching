[package]
name = "tries-suggest"
version = "0.1.0"
edition = "2024"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Web framework
axum = "0.8.6"
tower = "0.5.2"
tower-http = { version = "0.6.6", features = ["trace", "cors"] }

# Database
mongodb = "3.3.0"
redis = { version = "0.32.7", features = ["tokio-comp", "connection-manager"] }
dotenvy = "0.15"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
anyhow = "1"
thiserror = "2.0.17"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utilities
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"
regex = "1"
